name: 明远阁 · 盘中触发提醒

on:
  schedule:
    # A股交易时段（北京时间 09:30-11:30 / 13:00-15:00）对应 UTC 01:30-03:30 / 05:00-07:00
    - cron: '*/10 1-3,5-6 * * 1-5'
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MY_BASE: ${{ github.workspace }}
      DSH_SECRET_MAIL_PASS: ${{ secrets.MAIL_PASS }}
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查触发条件（有触发才发邮件）
        run: python tools/watch_check.py --mail
