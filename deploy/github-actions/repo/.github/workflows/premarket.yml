name: 明远阁 · 盘前简报

on:
  schedule:
    # 北京时间 08:30（UTC 00:30），周一到周五
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

jobs:
  premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MY_BASE: ${{ github.workspace }}
      DSH_SECRET_MAIL_PASS: ${{ secrets.MAIL_PASS }}
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 生成盘前简报
        run: python tools/premarket.py

      - name: 发送邮件
        run: |
          FILE="reports/premarket-$(date +%F).md"
          python tools/mail_report.py --file "$FILE" --subject "明远阁 | 盘前简报 $(date +%F)"

      - name: 回写报告到仓库（保留历史）
        run: |
          git config user.name "mingyuan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports history || true
          git commit -m "premarket $(date +%F)" || echo "no changes"
          git push || echo "push skipped"
